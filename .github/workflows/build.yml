
name: Build Android APK

on:
  workflow_dispatch: # Fitur agar kita bisa menekan tombol "Run" manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Ubah HTML jadi Aplikasi Android
        run: |
          # Membuat wadah aplikasi
          cordova create app com.adit.pixelfighter "Pixel Fighter"
          
          # Memasukkan file index.html milikmu ke dalam aplikasi
          cp index.html app/www/index.html
          
          # Membangun file APK
          cd app
          cordova platform add android
          cordova build android

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelFighter-App
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
