<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Fighter</title>
<style>
:root{--bg:#1a1626;--panel:#262038;--line:#3d3458;--acc:#ffcf4a;--txt:#f1ecff;--mut:#9d93bd}
*{box-sizing:border-box; user-select:none; -webkit-user-select:none;}
html, body { margin:0; width:100vw; height:100vh; overflow:hidden; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; }
.wrap{width:100vw; height:100vh; position:relative; overflow:hidden;}

h1{font-size:22px;margin:0 0 4px}
h2{font-size:14px;margin:0 0 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
p.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* LAYOUT PEMILIHAN KARAKTER (FIT SATU LAYAR TANPA SCROLL) */
.char-select-layout { display: flex; gap: 16px; height: calc(100vh - 70px); padding: 12px; align-items: stretch; }
.char-list-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
#gallery{display:grid; grid-template-columns:repeat(4, minmax(70px, 1fr)); gap:8px; overflow:hidden; max-height: calc(100vh - 140px);}
.pick{background:#1d1830;border:2px solid var(--line);border-radius:8px;padding:4px;text-align:center;cursor:pointer;font-size:12px; display:flex; flex-direction:column; align-items:center;}
.pick canvas{width:64px;height:72px; margin:0 auto;}
.pick.on{border-color:var(--acc);background:#2d2548}

.preview-container { width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#prev{width:140px;height:140px;background:repeating-conic-gradient(#2a2340 0 25%,#241d38 0 50%) 0 0/24px 24px;border-radius:8px; margin-bottom: 8px;}

button{background:#3a3158;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;touch-action:manipulation}
button.on{background:var(--acc);color:#2a2030;border-color:var(--acc);font-weight:600}

/* ============ LAYAR MENU & TRANSISI ============ */
.screen { display: none; position: absolute; inset: 0; width: 100vw; height: 100vh; background: var(--bg); }
.screen.active { display: flex; flex-direction: column; }
.menu-container { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; height: 100vh; }
.menu-btn { font-size: 16px; padding: 12px 24px; width: 220px; text-transform: uppercase; letter-spacing: .05em; text-align: center; }

/* ============ LAYAR ARENA (FULLSCREEN) ============ */
body.in-arena { background: #000; overflow: hidden; }
#layar-arena { background: #000; }
#arena { width: 100vw; height: 100vh; object-fit: contain; }
.back-float { position: absolute; top: 12px; left: 12px; background: rgba(38,32,56,.85); color: white; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; z-index: 100; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

/* Sembunyikan Gamepad di luar Arena */
body:not(.in-arena) #vpad { display: none !important; }

/* ============ VIRTUAL GAMEPAD CSS ============ */
#vpad{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:var(--vp-op,.55); touch-action:none;}
.vp-group{position:absolute;pointer-events:none}
.vp-dpad{position:absolute;inset:0;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(8,6,16,.78) 0 62%,rgba(8,6,16,.35) 100%);border:3px solid rgba(0,0,0,.65)}
.vp-arm{position:absolute;display:flex;align-items:center;justify-content:center;color:#f1d8ff;font-size:calc(var(--vp-dsize) * .09);
  background:linear-gradient(160deg,#b05ae0,#6b2aa0);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.35);
  transition:filter .06s,transform .06s}
.vp-arm.up{left:33.5%;top:9%;width:33%;height:41.5%;border-radius:12px 12px 0 0}
.vp-arm.down{left:33.5%;top:49.5%;width:33%;height:41.5%;border-radius:0 0 12px 12px}
.vp-arm.left{left:9%;top:33.5%;width:41.5%;height:33%;border-radius:12px 0 0 12px}
.vp-arm.right{left:49.5%;top:33.5%;width:41.5%;height:33%;border-radius:0 12px 12px 0}
.vp-arm.mid{left:33.5%;top:33.5%;width:33%;height:33%;border-radius:0}
.vp-arm.mid::after{content:"";width:46%;height:46%;border-radius:50%;background:rgba(0,0,0,.28)}
.vp-arm.on{filter:brightness(1.7) saturate(1.2);transform:scale(.94)}
.vp-btn{position:absolute;width:var(--vp-btn);height:var(--vp-btn);border-radius:50%;pointer-events:auto;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:#fff;font-weight:800;
  font-size:calc(var(--vp-btn) * .34);text-shadow:0 1px 2px rgba(0,0,0,.6);cursor:pointer;
  background:radial-gradient(circle at 36% 30%,var(--c1),var(--c2) 72%);
  border:calc(var(--vp-btn) * .07) solid #0e0a16;box-shadow:0 0 0 calc(var(--vp-btn) * .05) rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.35);
  transition:transform .05s,filter .05s,box-shadow .05s}
.vp-btn small{font-size:calc(var(--vp-btn) * .17);font-weight:600;opacity:.9;letter-spacing:.02em}
.vp-btn.on{transform:scale(.9);filter:brightness(1.45) saturate(1.25);
  box-shadow:0 0 0 calc(var(--vp-btn) * .06) rgba(255,255,255,.55),0 0 18px var(--c1),inset 0 3px 0 rgba(255,255,255,.2)}
</style>
</head>
<body class="in-arena">
<div class="wrap">
  
  <!-- LAYAR 1: MENU UTAMA -->
  <div id="layar-menu" class="screen">
    <div class="menu-container">
      <h1 style="font-size: 38px; color: var(--acc); margin-bottom: 2px;">Pixel Fighter</h1>
      <p class="sub" style="margin-bottom: 16px;">Raka vs Sari</p>
      <button class="menu-btn on" onclick="navigasi('layar-pilih')">Mulai Bermain</button>
      <button class="menu-btn" onclick="navigasi('layar-opsi')">Opsi</button>
    </div>
  </div>

  <!-- LAYAR 2: PEMILIHAN KARAKTER (TANPA SCROLL & ADA TOMBOL SELECT KIRI KANAN) -->
  <div id="layar-pilih" class="screen">
    <div style="padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line);">
      <button onclick="navigasi('layar-menu')" style="padding: 4px 10px; font-size: 12px;">⬅ Kembali</button>
      <h2 style="margin:0;">Pilih Karakter P1</h2>
      <div style="width: 70px;"></div>
    </div>
    
    <div class="char-select-layout">
      <div class="char-list-container">
        <div id="gallery"></div>
        <!-- Tombol Select Kiri Kanan -->
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 8px;">
          <button onclick="geserKarakter(-1)" style="flex:1; font-weight: bold; background: #3a3158;">◄ SEBELUMNYA</button>
          <button class="on" onclick="mulaiPertandingan()" style="flex:2; font-size: 15px;">FIGHT! ⚔️</button>
          <button onclick="geserKarakter(1)" style="flex:1; font-weight: bold; background: #3a3158;">SELANJUTNYA ►</button>
        </div>
      </div>

      <!-- PRATINJAU ANIMASI DI SAMPING -->
      <div class="preview-container">
        <canvas id="prev" width="140" height="140"></canvas>
        <div id="cname" style="font-size:18px;font-weight:700; text-align:center;"></div>
      </div>
    </div>
  </div>

  <!-- LAYAR 3: ARENA BERTARUNG (FULLSCREEN) -->
  <div id="layar-arena" class="screen active">
    <button class="back-float" onclick="navigasi('layar-menu')">⬅ Berhenti</button>
    <canvas id="arena" width="640" height="300"></canvas>
  </div>

  <!-- LAYAR 4: OPSI -->
  <div id="layar-opsi" class="screen">
    <div style="padding: 10px 16px;">
      <button onclick="navigasi('layar-menu')" style="margin-bottom: 10px;">⬅ Kembali</button>
      <div class="card">
        <h2>Pengaturan Gamepad</h2>
        <p class="sub">Tata letak Virtual Gamepad menggunakan D-Pad di kiri dan Tombol Aksi di kanan.</p>
      </div>
    </div>
  </div>

  <!-- LAYAR 5: KEMENANGAN -->
  <div id="layar-menang" class="screen">
    <div class="menu-container">
      <h1 id="teks-menang" style="font-size: 48px; color: var(--acc); margin-bottom: 24px; text-align: center;">K.O.!</h1>
      <button class="menu-btn on" onclick="mulaiPertandingan()">Main Lagi</button>
      <button class="menu-btn" onclick="navigasi('layar-menu')">Menu Utama</button>
    </div>
  </div>

</div>

<script>
/* ============ LOGIKA NAVIGASI LAYAR ============ */
function navigasi(targetId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(targetId).classList.add('active');

  if(targetId === 'layar-arena') {
    document.body.classList.add('in-arena');
    if(typeof VPAD !== 'undefined') VPAD.show(true);
  } else {
    document.body.classList.remove('in-arena');
    if(typeof VPAD !== 'undefined') VPAD.show(false);
  }
}

// Mulai langsung di menu utama saat aplikasi dibuka
navigasi('layar-menu');

/* ============ DATA KARAKTER & ENGINE SPRITE ============ */
const CHARS=[
 {name:'Raka', title:'The Crimson Striker', style:'raka', cos:'raka', hair:'#e8352a',skin:'#f6caa2',shirt:'#2f5fd8',accent:'#f4f4fa',pants:'#1c1b2a',shoe:'#f4f4f8',
  eye:'#d02848',glove:'#1e1a26',sleeve:'#2f5fd8',band2:'#d03040',stripe:'#d03040',toe:'#d03040',hp:100,atk:8, def:5,spd:3.2},
 {name:'Sari', title:'The Violet Storm', style:'sari', cos:'sari', hair:'#e8307c',skin:'#f6d0b0',shirt:'#1e1a2a',accent:'#ffd34a',pants:'#241c34',shoe:'#e84aa8',
  eye:'#a848d8',glove:'#1e1a26',sleeve:'#2a2238',band2:'#e84aa8',trim:'#e04aa0',sock:'#7a3ab8',legSkin:1,hp:85, atk:8, def:4,spd:3.6},
 {name:'Bima', style:'short',   hair:'#f08a24',skin:'#e0a878',shirt:'#2e9a5a',accent:'#f4f0c0',pants:'#5a4a2a',shoe:'#3a2a1a',hp:120,atk:10,def:6,spd:2.5},
 {name:'Dewi', style:'ponytail',hair:'#d9dff0',skin:'#f2c8a8',shirt:'#c23b4a',accent:'#ffffff',pants:'#2a2a3a',shoe:'#222222',hp:90, atk:9, def:4,spd:3.4},
 {name:'Joko', style:'bandana', hair:'#2a2430',skin:'#d8a070',shirt:'#dcdcdc',accent:'#ff6a3a',band:'#3a7bf0',pants:'#2a4a8a',shoe:'#e8e8e8',hp:95,atk:9,def:5,spd:3.2},
 {name:'Putri',style:'long',    hair:'#f4d35e',skin:'#f8d4b4',shirt:'#1fb5b0',accent:'#ff6a6a',pants:'#e6e6f0',shoe:'#e05a5a',hp:80, atk:7, def:4,spd:3.8},
 {name:'Arga', style:'mohawk',  hair:'#a64cf0',skin:'#f0c098',shirt:'#1a1a22',accent:'#ff4a8a',pants:'#44445a',shoe:'#ff4a8a',hp:90, atk:11,def:3,spd:3.0},
 {name:'Naga', style:'bandana', hair:'#1f5a3a',skin:'#e8b88a',shirt:'#f0e8d0',accent:'#c0392b',band:'#d83a3a',pants:'#f0e8d0',shoe:'#6a4a2a',hp:105,atk:9,def:6,spd:2.8}
];

function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(n>>16&255)},${f(n>>8&255)},${f(n&255)})`}
const mkc=()=>{const c=document.createElement('canvas');c.width=64;c.height=52;return c};
const spr=mkc(),sil=mkc(),out=mkc();

function drawSprite(g,c,face,anim,t){
  const sk=c.skin,hr=c.hair,sh=c.shirt,ac=c.accent,band=c.band||ac;
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)};
  g.save();g.translate(32,46);g.scale(face,1);
  let bob=Math.floor(t/350)%2,lean=0,hX=0,eyes='open',mouth=0;
  let fl=[1,-6,3,6],bl=[-4,-6,3,6];
  let fa={t:'v',x:5,y:-12,l:6},ba={t:'v',x:-7,y:-12,l:6};
  const hx=lean+hX,sl=shade(sh,.82),hl=shade(hr,1.3),hd=shade(hr,.72);
  const gl=c.glove,slv=c.sleeve||sl,bnd=c.band2;
  const arm=a=>{const x=a.x+lean,y=a.y+bob;
    if(a.t==='h'){R(x,y,a.l-3,2,slv);if(bnd)R(x+a.l-5,y,2,2,bnd);
      if(gl){R(x+a.l-4,y-1,4,3,gl)}else R(x+a.l-3,y-1,3,3,sk)}
    else{R(x,y,2,a.l-2,slv);if(gl){R(x-.5,y+a.l-3,3,3,gl)}else R(x,y+a.l-2,2,2,sk)}};
  const leg=(l,col,dark)=>{
    const hz=l[2]>l[3];
    if(c.legSkin){
      const sk2=shade(c.skin,dark?.85:1),so=shade(c.sock,dark?.85:1);
      R(l[0],l[1],l[2],l[3],sk2);
      if(hz){R(l[0]+l[2]-7,l[1],4,l[3],so);R(l[0]+l[2]-3,l[1]-1,3,l[3]+2,c.shoe)}
      else{R(l[0],l[1]+2,l[2],l[3]-4,so);R(l[0],l[1]+l[3]-2,l[2]+1,2,c.shoe)}
      return}
    R(l[0],l[1],l[2],l[3],col);
    if(hz){R(l[0]+l[2]-3,l[1]-1,3,l[3]+2,c.shoe)}else{R(l[0],l[1]+l[3]-2,l[2]+1,2,c.shoe)}};

  arm(ba); leg(bl,shade(c.pants,.82),1); leg(fl,c.pants);
  R(lean-4,-13+bob,8,7,sh);
  R(hx-5,-25+bob,10,1,sk);R(hx-6,-24+bob,12,10,sk);
  R(hx-5,-25+bob,10,1,hr);R(hx-6,-24+bob,12,4,hr);
  R(hx+1,-19+bob,2,3,'#1b1626');R(hx+4,-19+bob,2,3,'#1b1626');
  arm(fa);
  g.restore();
}

function render(ctx,c,x,y,s,face,anim,t){
  const sg=spr.getContext('2d'),lg=sil.getContext('2d'),og=out.getContext('2d');
  sg.clearRect(0,0,64,52);drawSprite(sg,c,face,anim,t);
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,64,52);lg.drawImage(spr,0,0);
  lg.globalCompositeOperation='source-in';lg.fillStyle='#120d1f';lg.fillRect(0,0,64,52);
  og.clearRect(0,0,64,52);
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>og.drawImage(sil,d[0],d[1]));
  og.drawImage(spr,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(out,Math.round(x-32*s),Math.round(y-46*s),64*s,52*s);
}

/* ============ GALERI & PEMILIHAN KARAKTER ============ */
let sel=0;
const gal=document.getElementById('gallery');
const gcv=CHARS.map((c,i)=>{
  const d=document.createElement('div');d.className='pick';
  const cv=document.createElement('canvas');cv.width=64;cv.height=72;
  d.appendChild(cv);d.appendChild(document.createTextNode(c.name));
  d.onclick=()=>{sel=i;updInfo();};
  gal.appendChild(d);
  
  // Render thumbnail di galeri
  const x=cv.getContext('2d');
  render(x,c,32,60,2,1,'idle',0);
  return d;
});

function geserKarakter(arah) {
  sel = (sel + arah + CHARS.length) % CHARS.length;
  updInfo();
}

const pv=document.getElementById('prev'),pg=pv.getContext('2d');
function updInfo(){
  gcv.forEach((d,i)=>d.classList.toggle('on',i===sel));
  document.getElementById('cname').innerHTML=CHARS[sel].name+`<div style="font-size:12px;font-weight:600;color:var(--acc);margin-top:4px">${CHARS[sel].title||''}</div>`;
}
updInfo();

/* ============ ARENA & LOGIKA PERTANDINGAN ============ */
const ac=document.getElementById('arena'),ag=ac.getContext('2d');
const A={W:640,H:300,gy:262,s:3};
const bld=[[20,90,50],[80,140,40],[130,70,60],[200,120,50],[270,100,70],[350,150,45],[405,90,60],[475,130,50],[535,80,55],[595,110,50]];
let p1,p2,now=0,over=0,sparks=[],trail=[],pops=[],combo={n:0,who:null,t:0},ai={until:0,act:'idle',done:false,start:0};
const keys={left:0,right:0,jump:0,down:0,punch:0,punchR:0,kick:0,kickR:0,block:0,dash:0};
const lastTap={left:-1e9,right:-1e9};

let fightState = 'idle';
let countdownStart = 0;

const mk=(c,x,face)=>({c,x,y:0,vy:0,vx:0,jvx:0,fast:false,dd:1,tc:0,jug:0,face,hp:c.hp,st:'idle',t0:now,hit:false});

function mulaiPertandingan() {
  let p2Idx = Math.floor(Math.random() * CHARS.length);
  if(p2Idx === sel) p2Idx = (p2Idx + 1) % CHARS.length;

  p1 = mk(CHARS[sel], 170, 1);
  p2 = mk(CHARS[p2Idx], 470, -1);
  over = 0; sparks=[]; trail=[]; pops=[]; combo={n:0,who:null,t:0};
  
  fightState = 'countdown';
  countdownStart = performance.now();
  
  navigasi('layar-arena');
}

const set=(f,s)=>{if(f.st!==s){f.st=s;f.t0=now;f.hit=false}};

const MOVES={
 punch:  {dur:320,hit:[70,200],reach:62,dmg:.8,kb:240,type:'high',cancel:170},
 punch2: {dur:420,hit:[100,260],reach:68,dmg:1.3,kb:320,type:'high',cancel:230},
 kick:   {dur:440,hit:[100,290],reach:70,dmg:1.2,kb:400,type:'mid',cancel:290},
 rkick:  {dur:540,hit:[140,340],reach:76,dmg:1.6,kb:470,type:'mid',cancel:340},
 upper:  {dur:520,hit:[60,280],reach:56,dmg:1.5,kb:120,launch:-700,type:'mid',tol:110,rise:-520,label:'UPPERCUT',cancel:220},
 upperR: {dur:520,hit:[60,280],reach:58,dmg:1.7,kb:120,launch:-700,type:'mid',tol:110,rise:-520,label:'UPPERCUT',cancel:220},
 lpunch: {dur:280,hit:[60,160],reach:58,dmg:.6,kb:140,type:'low',cancel:150},
 sweep:  {dur:560,hit:[150,380],reach:86,dmg:1.0,kb:160,knock:-300,type:'low',label:'SWEEP'},
 lunge:  {dur:480,hit:[130,320],reach:84,dmg:1.6,kb:380,step:420,type:'mid',label:'LUNGE'},
 airkick:{dur:380,hit:[40,320],reach:72,dmg:1.2,kb:380,type:'mid',tol:120},
 airkickR:{dur:380,hit:[40,320],reach:74,dmg:1.4,kb:420,type:'mid',tol:120}
};
const DUR={hit:380,dash:240,bdash:260,down:650};
for(const k in MOVES)DUR[k]=MOVES[k].dur;
const hopOf=f=>f.st==='bdash'?-Math.sin(Math.min(1,(now-f.t0)/DUR.bdash)*Math.PI)*5*A.s:0;

function dust(x,n,big){
  for(let i=0;i<n;i++)sparks.push({x:x+(Math.random()-.5)*24,y:A.gy-2,vx:(Math.random()-.5)*120*(big?1.6:1),l:1,d:2.4,k:'dust',z:3+Math.random()*(big?5:3)});
}
function startMove(f,k){
  const m=MOVES[k];set(f,k);
  if(m.rise){f.vy=m.rise;f.jvx=0;f.y=Math.min(f.y,-1)}
  if(m.step)f.vx=f.face*m.step;
  dust(f.x,2);
}

function think(f,inp,dt){
  const air=f.y<0||f.vy!==0;
  const dur=DUR[f.st];
  const busy=dur&&now-f.t0<dur;
  const dx=(inp.right?1:0)-(inp.left?1:0);

  if(!busy){
    if(dur)set(f,'idle');
    if(!air){
      const fwd=dx*f.face>0;
      if(inp.dash){f.dd=inp.dash;set(f,inp.dash===f.face?'dash':'bdash');dust(f.x-f.dd*10,5)}
      else if(inp.block)set(f,'block');
      else if(inp.jump&&(inp.punch||inp.punchR))startMove(f,inp.punchR?'upperR':'upper');
      else if(inp.down&&(inp.punch||inp.punchR))startMove(f,'lpunch');
      else if(inp.down&&(inp.kick||inp.kickR))startMove(f,'sweep');
      else if(inp.punchR)startMove(f,fwd?'lunge':'punch2');
      else if(inp.punch)startMove(f,'punch');
      else if(inp.kickR)startMove(f,'rkick');
      else if(inp.kick)startMove(f,'kick');
      else if(inp.jump){f.vy=-640;f.jvx=dx*f.c.spd*62;f.fast=false;set(f,'jump');dust(f.x,3)}
      else if(inp.down)set(f,'crouch');
      else if(dx){f.x+=dx*f.c.spd*55*dt;set(f,'walk')}
      else set(f,'idle');
    }else{
      if(f.st!=='jump')set(f,'jump');
      f.x+=dx*f.c.spd*18*dt;
    }
  }
}

function physics(f,dt){
  if(f.y<0||f.vy!==0){
    f.vy+=2200*dt;f.y+=f.vy*dt;f.x+=f.jvx*dt;
    if(f.y>=0){
      f.y=0;f.vy=0;f.jvx=0;
      const big=f.fast||f.st==='launch';
      dust(f.x,big?9:4,big);
      f.fast=false;
      if(f.st==='launch'){set(f,'down');f.jug=0}
      else if(['jump','upper','upperR','airkick','airkickR'].includes(f.st))set(f,'idle');
    }
  }
  f.x+=f.vx*dt;f.vx-=f.vx*8*dt;
}

function control(f,inp,dt){
  if(f.st!=='ko'&&f.st!=='win'&&f.st!=='launch')think(f,inp,dt);
  physics(f,dt);
}

function tryHit(f,o){
  if(o.st==='ko'||o.st==='down')return;
  let k=f.st;if(k==='jump'&&f.fast)k='dive';
  const m=MOVES[k];
  if((!m&&k!=='dive')||f.hit)return;
  const t=now-f.t0,w=k==='dive'?[0,1e9]:m.hit;
  if(t<w[0]||t>w[1])return;
  let ok;
  if(k==='dive'){const dy=o.y-f.y;ok=f.vy>0&&Math.abs(o.x-f.x)<46&&dy>0&&dy<110}
  else{const dx=(o.x-f.x)*f.face;ok=dx>=0&&dx<=m.reach&&Math.abs(o.y-f.y)<(m.tol||60)}
  if(!ok)return;
  const type=k==='dive'?'mid':m.type;
  if(o.st==='bdash'&&now-o.t0<150)return;
  if(o.st==='crouch'&&type==='high')return;
  const dir=k==='dive'?(o.x>=f.x?1:-1):f.face;
  f.hit=true;
  const blocked=o.st==='block'&&o.face===-dir&&type!=='low';
  const sx=o.x-dir*14,sy=A.gy+o.y-(k==='dive'?30:55);
  let dmg=f.c.atk*(m?m.dmg:1.1)*(1-o.c.def*0.04);
  
  if(blocked){
    dmg*=0.15;combo.n=0;o.vx=dir*160;
    sparks.push({x:sx,y:sy,l:1,c:'#8cd0ff'});
  }else{
    const chain=(o.st==='hit'||o.st==='launch')&&combo.who===f&&now-combo.t<900;
    combo.n=chain?combo.n+1:1;combo.who=f;combo.t=now;
    dmg*=Math.max(.4,1-.12*(combo.n-1));
    const lch=k==='dive'?0:(m.launch||m.knock||0);
    if(lch){
      if(o.st!=='launch'){set(o,'launch');o.jug=0}else o.jug++;
      if(o.jug<=3){o.vy=lch;o.y=Math.min(o.y,-1)}
      o.vx=dir*(m.kb||120);o.jvx=0;
    }else{
      o.vx=dir*(k==='dive'?340:m.kb);set(o,'hit');
    }
    sparks.push({x:sx,y:sy,l:1,c:lch?'#ff8a4a':'#ffd34a'});
    if(m&&m.label)pops.push({x:f.x+f.face*30,y:A.gy+f.y-100,t:m.label,l:1});
  }
  
  o.hp=Math.max(0,o.hp-dmg);
  if(o.hp<=0){
    set(o,'ko'); set(f,'win'); o.vx=dir*500; over=now; fightState = 'over';
    setTimeout(() => {
      document.getElementById('teks-menang').innerHTML = f.c.name + "<br><span style='font-size:24px;color:white'>MENANG!</span>";
      navigasi('layar-menang');
    }, 2500);
  }
}

function aiInput(f,o){
  const inp={left:0,right:0,jump:0,punch:0,punchR:0,kick:0,kickR:0,block:0,down:0,dash:0};
  if(fightState !== 'playing') return inp;
  const d=Math.abs(o.x-f.x),dir=o.x>f.x?1:-1,toward=dir>0?'right':'left';
  if(o.st==='launch'||o.st==='down'||f.st==='launch'||f.st==='down')return inp;
  if(now>ai.until){
    ai.done=false;ai.start=now;ai.side=Math.random()<.5;
    const r=Math.random();
    if(d>95)ai.act='move';
    else if(r<.2)ai.act='punch';else if(r<.4)ai.act='kick';else if(r<.6)ai.act='block';else ai.act='idle';
    ai.until=now+350;
  }
  if(ai.act==='move')inp[toward]=1;
  if(ai.act==='punch')inp.punch=1;
  if(ai.act==='kick')inp.kick=1;
  if(ai.act==='block')inp.block=1;
  return inp;
}

function update(dt){
  if(!p1)return;
  if (fightState === 'playing') {
    control(p1, over ? {} : keys, dt); keys.dash = 0;
    control(p2, aiInput(p2, p1), dt);
  } else {
    physics(p1, dt); physics(p2, dt);
  }

  [[p1,p2],[p2,p1]].forEach(([f,o])=>{
    if(fightState === 'playing') tryHit(f,o);
    const free=!DUR[f.st]&&f.st!=='ko'&&f.st!=='win'&&f.st!=='launch';
    if(free&&f.y===0)f.face=o.x>=f.x?1:-1;
    f.x=Math.max(40,Math.min(A.W-40,f.x));
  });
  
  const gap=p2.x-p1.x;
  if(Math.abs(gap)<26&&p1.y===0&&p2.y===0){const push=(26-Math.abs(gap))/2*Math.sign(gap||1);p1.x-=push;p2.x+=push}
  sparks.forEach(s=>{s.l-=dt*(s.d||4);if(s.vx)s.x+=s.vx*dt});sparks=sparks.filter(s=>s.l>0);
  trail.forEach(s=>s.l-=dt*6);trail=trail.filter(s=>s.l>0);
  pops.forEach(p=>{p.l-=dt*1.6;p.y-=30*dt});pops=pops.filter(p=>p.l>0);
}

function drawFighter(f){
  const g=ag,sc=Math.max(.4,1+f.y/220);
  g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(f.x,A.gy+2,26*sc,6*sc,0,0,7);g.fill();
  const t=DUR[f.st]?now-f.t0:now;
  let an=f.st;
  if(f.st==='jump')an=f.fast?'dive':(f.vy>0?'fall':'jump');
  else if(f.st==='launch'||f.st==='down')an='ko';
  render(g,f.c,f.x,A.gy+f.y+hopOf(f),A.s,f.face,an,t);
}

function drawBar(f,x,right){
  const g=ag,w=250,r=f.hp/f.c.hp;
  g.fillStyle='#120d1f';g.fillRect(x-3,13,w+6,20);
  g.fillStyle='#3a2a4a';g.fillRect(x,16,w,14);
  g.fillStyle=r>.5?'#4ade80':r>.25?'#facc15':'#f87171';
  const bw=w*r;g.fillRect(right?x+w-bw:x,16,bw,14);
  g.fillStyle='#fff';g.font='bold 13px system-ui';g.textAlign=right?'right':'left';
  g.fillText(f.c.name,right?x+w:x,48);
}

function drawArena(){
  const g=ag;g.imageSmoothingEnabled=false;
  if(ac.width !== innerWidth || ac.height !== innerHeight) {
    ac.width = innerWidth; ac.height = innerHeight;
    A.W = innerWidth; A.H = innerHeight; A.gy = A.H - 50;
  }

  const gr=g.createLinearGradient(0,0,0,A.gy);gr.addColorStop(0,'#2a1f4a');gr.addColorStop(1,'#7a4a8a');
  g.fillStyle=gr;g.fillRect(0,0,A.W,A.H);
  g.fillStyle='#1d1536';bld.forEach(b=>g.fillRect(b[0]%(A.W+100),A.gy-b[1],b[2],b[1]));
  g.fillStyle='#3a2a52';g.fillRect(0,A.gy,A.W,A.H-A.gy);
  
  if(p1 && p2) [p1,p2].sort((a,b)=>a.y-b.y).forEach(drawFighter);
  if(p1 && p2) { drawBar(p1,20,false); drawBar(p2,A.W-270,true); }

  // Hitung Mundur 3, 2, 1, FIGHT!
  if(fightState === 'countdown') {
    const elapsed = now - countdownStart;
    let text = '';
    if(elapsed < 1000) text = '3';
    else if(elapsed < 2000) text = '2';
    else if(elapsed < 3000) text = '1';
    else if(elapsed < 4000) { 
      text = 'FIGHT!'; 
      if(elapsed > 3000 && elapsed < 3033) fightState = 'playing';
    } else {
      fightState = 'playing';
    }

    if(text) {
      g.fillStyle = '#ffd34a'; g.font = 'bold 72px system-ui'; g.textAlign = 'center';
      g.lineWidth = 6; g.strokeStyle = '#120d1f';
      g.strokeText(text, A.W / 2, A.H / 2 + 20);
      g.fillText(text, A.W / 2, A.H / 2 + 20);
    }
  }
}

/* ============ LOOP PREVIEW & ARENA ============ */
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;now=ts;
  
  // Render animasi di layar pemilihan karakter
  const px=pg.getContext('2d');
  px.clearRect(0,0,140,140);
  render(px,CHARS[sel],70,115,3,1,'idle',ts);

  if(document.getElementById('layar-arena').classList.contains('active')){
    update(dt); drawArena();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============ INPUT & GAMEPAD ============ */
const MAP={a:'left',arrowleft:'left',d:'right',arrowright:'right',w:'jump',arrowup:'jump',' ':'jump',s:'down',arrowdown:'down',j:'punch',k:'punchR',u:'kick',i:'kickR',l:'block'};
function press(k){ keys[k]=1; }
addEventListener('keydown',e=>{ const k=MAP[e.key.toLowerCase()]; if(k){press(k);e.preventDefault()} });
addEventListener('keyup',e=>{ const k=MAP[e.key.toLowerCase()]; if(k)keys[k]=0; });

const VPAD_CONFIG={
  show:'auto', opacity:.55, vibrate:10, toggleButton:false,
  dpad:{
    enabled:true, x:'6vmin', y:'8vmin', side:'left', size:'clamp(130px,36vmin,200px)',
    diagonals:true, deadzone:.22,
    keys:{up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'},
    labels:{up:'▲',down:'▼',left:'◀',right:'▶'}
  },
  buttons:{
    enabled:true, x:'6vmin', y:'8vmin', side:'right', size:'clamp(50px,13.5vmin,85px)', gap:'2vmin',
    colors:{ pink:['#ff7ad8','#c9239a'], gray:['#9a9aa6','#4a4a56'] },
    items:[
      {label:'L', sub:'Block',  key:'l', color:'gray', col:0, row:0, dy:0.5},
      {label:'J', sub:'Tinju L',key:'j', color:'pink', col:1, row:0, dy:0},
      {label:'K', sub:'Tinju R',key:'k', color:'pink', col:2, row:0, dy:0.5},
      {label:'⤒', sub:'Lompat', key:' ', color:'gray', col:0, row:1, dy:0.5},
      {label:'U', sub:'Kaki L', key:'u', color:'pink', col:1, row:1, dy:0},
      {label:'I', sub:'Kaki R', key:'i', color:'pink', col:2, row:1, dy:0.5}
    ]
  }
};

const VPAD=(()=>{
  const held=new Map();
  const send=(key,down)=>window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key,bubbles:true,cancelable:true}));
  const hold=ks=>[].concat(ks).forEach(k=>{const n=(held.get(k)||0)+1;held.set(k,n);if(n===1)send(k,true)});
  const free=ks=>[].concat(ks).forEach(k=>{const n=(held.get(k)||0)-1;if(n<=0){held.delete(k);send(k,false)}else held.set(k,n)});
  let root=null;

  function build(){
    if(root)root.remove();
    root=document.createElement('div');root.id='vpad';
    root.style.setProperty('--vp-op',cfg.opacity);
    const side=(g,el,w,h)=>{el.style.bottom=g.y;el.style[g.side==='right'?'right':'left']=g.x;el.style.width=w;el.style.height=h};

    const d=cfg.dpad;
    if(d&&d.enabled){
      const grp=document.createElement('div');grp.className='vp-group';
      grp.style.setProperty('--vp-dsize',d.size);side(d,grp,d.size,d.size);
      const pad=document.createElement('div');pad.className='vp-dpad';grp.appendChild(pad);
      ['up','down','left','right','mid'].forEach(n=>{const a=document.createElement('div');a.className='vp-arm '+n;pad.appendChild(a)});
      
      const read=e=>{
        const r=pad.getBoundingClientRect(),nx=(e.clientX-r.left)/r.width*2-1,ny=(e.clientY-r.top)/r.height*2-1;
        const s=new Set();
        if(Math.hypot(nx,ny)<d.deadzone)return s;
        if(nx>0.2)s.add('right');else if(nx<-0.2)s.add('left');
        if(ny>0.2)s.add('down');else if(ny<-0.2)s.add('up');
        return s;
      };
      let act=new Set();
      const apply=next=>{
        act.forEach(n=>{if(!next.has(n)){free(d.keys[n])}});
        next.forEach(n=>{if(!act.has(n)){hold(d.keys[n])}});
        act=next;
      };
      pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);apply(read(e))});
      pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))apply(read(e))});
      ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,()=>apply(new Set())));
      root.appendChild(grp);
    }

    const b=cfg.buttons;
    if(b&&b.enabled&&b.items.length){
      const cols=Math.max(...b.items.map(i=>i.col))+1,rows=Math.max(...b.items.map(i=>i.row))+1;
      const grp=document.createElement('div');grp.className='vp-group';
      grp.style.setProperty('--vp-btn',b.size);
      side(b,grp,`calc(${cols} * (${b.size} + ${b.gap}))`,`calc(${rows} * (${b.size} + ${b.gap}))`);
      b.items.forEach(it=>{
        const el=document.createElement('div');el.className='vp-btn';
        const [c1,c2]=b.colors[it.color]||b.colors.pink;
        el.style.setProperty('--c1',c1);el.style.setProperty('--c2',c2);
        el.style.left=`calc(${it.col} * (${b.size} + ${b.gap}))`;
        el.style.top=`calc(${it.row} * (${b.size} + ${b.gap}))`;
        el.innerHTML=`<span>${it.label}</span>`;
        let on=false;
        const down=e=>{e.preventDefault();if(on)return;on=true;el.setPointerCapture(e.pointerId);hold(it.key)};
        const up=()=>{if(!on)return;on=false;free(it.key)};
        el.addEventListener('pointerdown',down);
        ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
        grp.appendChild(el);
      });
      root.appendChild(grp);
    }
    document.body.appendChild(root);
    show(false);
  }

  function show(v){ if(root)root.hidden=!v; }
  let cfg=VPAD_CONFIG;
  return { rebuild(p){cfg=Object.assign({},VPAD_CONFIG,p);build()}, show };
})();
VPAD.rebuild();
